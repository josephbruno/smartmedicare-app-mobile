name: maran
description: Maran Billing — Flutter client (MVVM) for Android, iOS, Windows, macOS.
publish_to: 'none'

version: 1.0.28+29

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.3
  provider: ^6.1.2
  go_router: ^14.6.2
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  connectivity_plus: ^6.1.1
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4+4
  path: ^1.9.0
  path_provider: ^2.1.5
  intl: ^0.19.0
  uuid: ^4.5.1
  qr_flutter: ^4.1.0
  printing: ^5.13.4
  pdf: ^3.11.1
  url_launcher: ^6.3.1
  file_picker: ^8.1.7
  fl_chart: ^0.71.0
  flutter_local_notifications: ^18.0.1
  windows_printer: ^0.2.1
  image: ^4.5.4
  package_info_plus: ^8.3.0
  crypto: ^3.0.6
  video_player: ^2.9.5
  video_player_win: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/logo.png
    - assets/branding/receipt-logo.png
    - assets/branding/pet-hero.png
    - assets/branding/splash.mp4
